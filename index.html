<body><div id="boot">Memuat AppPUN…</div>
<script type="module">
const SOURCE='https://raw.githubusercontent.com/apppun/apppun/3fc80203bf66b2622bc775a207a42811198cdacb/index.html';
const URL='https://rxkumheztyyamchhejlk.supabase.co';
const KEY='sb_publishable_cN9rnx7YGQm8a-dfxMQCgw_6Ho1yrzj';
const source=await (await fetch(SOURCE,{cache:'no-store'})).text();
const d=new DOMParser().parseFromString(source,'text/html');
const old=[...d.querySelectorAll('script[type="module"]')][0];
if(!old) throw new Error('App module missing');
let code=old.textContent;
const start=code.indexOf('        import { initializeApp }');
const end=code.indexOf('        const LOCAL_STORAGE_PREFIX');
if(start<0||end<0) throw new Error('Backend block missing');
const bridge=`
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
        const supabase = createClient("${URL}", "${KEY}");
        const mapUser = (u) => u ? { ...u, uid: u.id } : null;
        const initializeApp = (config) => config;
        const getAuth = () => supabase.auth;
        const getFirestore = () => ({ __supabase: true });
        const auth = supabase.auth;
        const db = { __supabase: true };
        const doc = (_db, collectionName, id) => ({ collectionName, id });
        const collection = (_db, collectionName) => ({ collectionName });
        const signInWithEmailAndPassword = async (_auth, email, password) => {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            return { user: mapUser(data.user) };
        };
        const createUserWithEmailAndPassword = async (_auth, email, password) => {
            const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { npwp: email.split('@')[0] } } });
            if (error) throw error;
            return { user: mapUser(data.user) };
        };
        const signOut = async () => { const { error } = await supabase.auth.signOut(); if (error) throw error; };
        const onAuthStateChanged = (_auth, callback) => {
            supabase.auth.getSession().then(({data}) => callback(mapUser(data.session?.user)));
            const { data } = supabase.auth.onAuthStateChange((_event, session) => callback(mapUser(session?.user)));
            return () => data.subscription.unsubscribe();
        };
        const sendPasswordResetEmail = async (_auth, email) => {
            const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
            if (error) throw error;
        };
        const getCountFromServer = async (ref) => {
            const { count, error } = await supabase.from(ref.collectionName === 'users' ? 'profiles' : ref.collectionName).select('id', { count: 'exact', head: true });
            if (error) throw error;
            return { data: () => ({ count: count || 0 }) };
        };
        const setDoc = async (ref, payload, options = {}) => {
            if (ref.collectionName !== 'users') throw new Error('Unsupported collection');
            const state = { ...payload };
            delete state.updatedAt;
            const { error } = await supabase.from('app_state').upsert({ user_id: ref.id, state, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
            if (error) throw error;
        };
        const onSnapshot = (ref, callback, onError) => {
            let active = true;
            supabase.from('app_state').select('state,updated_at').eq('user_id', ref.id).maybeSingle().then(({data,error}) => {
                if(!active) return;
                if(error) return onError?.(error);
                callback({ exists: () => !!data, data: () => data?.state || {} });
            }).catch(e => onError?.(e));
            const channel=supabase.channel('app-state-'+ref.id).on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'user_id=eq.'+ref.id},payload=>{
                if(!active||!payload.new?.state) return;
                callback({ exists: () => true, data: () => payload.new.state });
            }).subscribe();
            return () => { active=false; supabase.removeChannel(channel); };
        };
`;
code=bridge+code.slice(end);
old.remove();
for(const el of [...d.querySelectorAll('script')]) if(el.textContent.includes('pwabuilder')||el.src.includes('firebase')) el.remove();
const s=d.createElement('script');s.type='module';s.textContent=code;d.body.appendChild(s);
document.documentElement.replaceWith(d.documentElement);
