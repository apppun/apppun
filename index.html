<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AppPUN</title></head><body><div id="boot">Memuat AppPUN…</div><script type="module">

const SUPABASE_URL='https://rxkumheztyyamchhejlk.supabase.co';
const SUPABASE_KEY='sb_publishable_cN9rnx7YGQm8a-dfxMQCgw_6Ho1yrzj';
const src=await (await fetch(SOURCE,{cache:'no-store'})).text();
const parser=new DOMParser(); const doc=parser.parseFromString(src,'text/html');
const scripts=[...doc.querySelectorAll('script[type="module"]')];

let appScript=scripts[0].textContent;

        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
        const supabase = createClient("${SUPABASE_URL}", "${SUPABASE_KEY}");

        const db = { __supabase: true };
        const doc = (_db, collectionName, id) => ({ collectionName, id });
        const collection = (_db, collectionName) => ({ collectionName });
        const signInWithEmailAndPassword = async (_auth, email, password) => { const { data, error } = await supabase.auth.signInWithPassword({ email, password }); if(error) throw error; return { user: data.user }; };
        const createUserWithEmailAndPassword = async (_auth, email, password) => { const { data, error } = await supabase.auth.signUp({ email, password, options:{ data:{ npwp: email.split('@')[0] } } }); if(error) throw error; return { user:data.user }; };
        const signOut = async () => { const { error } = await supabase.auth.signOut(); if(error) throw error; };
        const onAuthStateChanged = (_auth, callback) => { supabase.auth.getSession().then(({data})=>callback(data.session?.user||null)); const {data}=supabase.auth.onAuthStateChange((_event,session)=>callback(session?.user||null)); return ()=>data.subscription.unsubscribe(); };
        const sendPasswordResetEmail = async (_auth,email) => { const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin}); if(error) throw error; };
        const getCountFromServer = async (_ref) => { const {data,error}=await supabase.rpc('get_public_user_count'); if(error) throw error; return { data:()=>({count:Number(data||0)}) }; };
        const setDoc = async (ref,payload) => { if(ref.collectionName!=='users') throw new Error('Unsupported collection'); const state={...payload}; delete state.updatedAt; const {error}=await supabase.from('app_state').upsert({user_id:ref.id,state,updated_at:new Date().toISOString()},{onConflict:'user_id'}); if(error) throw error; };
        const onSnapshot = (ref,callback,onError) => { let active=true; supabase.from('app_state').select('state,updated_at').eq('user_id',ref.id).maybeSingle().then(({data,error})=>{if(!active)return;if(error)return onError?.(error);callback({exists:()=>!!data,data:()=>data?.state||{}})}).catch(e=>onError?.(e)); const channel=supabase.channel('app-state-'+ref.id).on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'user_id=eq.'+ref.id},payload=>{if(active&&payload.new?.state)callback({exists:()=>true,data:()=>payload.new.state})}).subscribe(); return ()=>{active=false;supabase.removeChannel(channel)}; };
`;

        `+appScript.slice(countEnd);

        });

`+appScript.slice(authStart);
for(const el of scripts) el.remove();
