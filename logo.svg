<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Icon Primary Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>

  <!-- Logo Mark Group -->
  <g filter="url(#shadow)">
    <!-- Base Shield / Folder Shape -->
    <path d="M 170 120 L 330 120 C 352 120, 370 138, 370 160 L 370 340 C 370 362, 352 380, 330 380 L 170 380 C 148 380, 130 362, 130 340 L 130 160 C 130 138, 148 120, 170 120 Z" fill="url(#iconGrad)"/>

    <!-- Screen / Display Area -->
    <rect x="165" y="155" width="170" height="55" rx="10" fill="#ffffff" opacity="0.95"/>
    <!-- Display Bars (Symbolizing Math/Data) -->
    <rect x="180" y="175" width="60" height="15" rx="4" fill="#2563eb"/>
    <rect x="290" y="175" width="30" height="15" rx="4" fill="#10b981"/>

    <!-- Calculator Buttons Grid -->
    <!-- Row 1 -->
    <rect x="165" y="235" width="40" height="30" rx="8" fill="#ffffff" opacity="0.2"/>
    <rect x="230" y="235" width="40" height="30" rx="8" fill="#ffffff" opacity="0.2"/>
    <rect x="295" y="235" width="40" height="30" rx="8" fill="#ffffff" opacity="0.2"/>

    <!-- Row 2 -->
    <rect x="165" y="280" width="40" height="30" rx="8" fill="#ffffff" opacity="0.2"/>
    <rect x="230" y="280" width="40" height="30" rx="8" fill="#ffffff" opacity="0.2"/>
    <rect x="295" y="280" width="40" height="30" rx="8" fill="#ffffff" opacity="0.2"/>

    <!-- Growth Graph Overlay (Surging Line) -->
    <path d="M 130 320 Q 200 310, 240 250 T 370 160" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="370" cy="160" r="10" fill="#10b981"/>
  </g>

  <!-- Typography: AppPUN -->
  <text x="250" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    App<tspan fill="#60a5fa">PUN</tspan>
  </text>
</svg>
